name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # la version vient de "packageManager" dans package.json — une seule source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      # Garde-fous : ce qui ne doit jamais atteindre la production.
      - name: Forbidden strings gate
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          grep -rIlE '\+33[0-9 .-]{9,}' out/ && fail "numéro de téléphone personnel dans le build" || true
          grep -rIl 'outlook\.fr' out/ && fail "email personnel dans le build" || true
          grep -rIl '000 000 000 00000' out/ && fail "SIRET fictif dans le build" || true
          grep -rIl 'ph-label' out/ && fail "réserve d'image (placeholder) dans le build" || true
          echo "Aucune chaîne interdite trouvée."

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: site
          path: out/
          retention-days: 3

  deploy:
    name: Deploy to OVH
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: out }

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Aucune action tierce : le transfert est entièrement lisible ici.
      # --delete synchronise à l'identique : tout fichier absent de out/ est
      # supprimé côté serveur. FTP_PATH doit donc pointer UNIQUEMENT sur la
      # racine web du site, jamais sur un dossier partagé.
      - name: Upload over FTPS
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USER }}
          FTP_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.OVH_FTP_PATH }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror --reverse --delete --parallel=4 \
                   --exclude-glob .git* \
                   out/ \"$FTP_PATH\";
          "

      - name: Smoke test
        run: |
          for url in https://cham-studio.fr/fr/ https://cham-studio.fr/en/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url")
            echo "$url → $code"
            [ "$code" = "200" ] || exit 1
          done
